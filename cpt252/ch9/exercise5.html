<!DOCTYPE html>

<html lang = "en">

        <head>

        <title>
            CPT 252 | Ch9 | Ex 5
        </title>

        <meta charset="utf-8">

        <style>

            #wrapper{
                width: 80%;
                margin: 0 auto;
                padding: 20px; 
                background-color: rgb(246, 246, 246);
                min-width: 600px;                    
                max-width: 1600px;
            }

            header, footer{
                text-align: center;
                background-color: rgb(244, 244, 244);
            }

            fieldset{
                width: 25%;
                margin: 20px;
                display: flex;
                flex-direction: column;
            }

            label, fieldset, textarea, select, input[type="submit"]{
                margin-left: 20px;
            }

            input{
                margin-bottom: 10px;
            }

        </style>

    </head>

    <body>

        <div id = "wrapper">

            <form>
    

                <header>
                    <h1> Music Survey</h1>
                </header>

                <label for="name">Name:</label>               
                <input type="text" name="name" id="name" maxlength="30">

                <br>

                <label for="email">Email:</label>               
                <input type="email" name="email" id="email" maxlength="30">

                <fieldset>

                    <legend>Select Your Favorite Type of Music:</legend>

                    <label><input type="checkbox" name="pop" value="pop">Pop</label>
                    <label><input type="checkbox" name="classical" value="classical">Classical</label>
                    <label><input type="checkbox" name="rock" value="rock">Rock</label>
                    <label><input type="checkbox" name="folk" value="folk">Folk</label>
                    <label><input type="checkbox" name="rap" value="rap">Rap</label>                    
                    <label><input type="checkbox" name="other" value="other">Other</label>

                </fieldset>

                <fieldset>

                    <legend>Select how often you purchase Music:</legend>
                    
                    <label><input type="radio" name="weekly" value="weekly">Weekly</label>
                    <label><input type="radio" name="few" value="few">A few CDs each year</label>
                    <label><input type="radio" name="monthly" value="monthly">Monthly</label>
                    <label><input type="radio" name="never" value="never">Never purchase</label>

                </fieldset>
                    
                    <label> Select the Locations you listen to Music</label>

                    <br>
                    <select style="width: 25%;" name ="Location" id="location" size="3">
                        <option value = "home">At home</option>
                        <option value = "car">In the car</option>
                        <option value = "anywhere">Anywhere</option>   
                    </select> 
                
                    <br> <br>

                    <label>What role does music play in your life?</label>
                    <br>
                    <textarea style="width: 25%;" name="roleComments" id="roleComments" maxlength="250"></textarea>

                    <br> <br>

                <input type="submit" name="submit" id="submit" value="Submit">
                <input type="reset" name="reset" id="reset" value="Reset">

                </form>

                <footer>
                    Contact Colby here: <a href="mailto:colby.wirth@maine.edu">colby.wirth@maine.edu</a>
                </footer>
            
        </div>

    </body>



</html>
